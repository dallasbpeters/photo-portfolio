name: CI

# Checks only. Migrations are not run here: each Vercel project's own build
# command is `pnpm db:migrate && pnpm build`, so every deploy brings its own
# database up to date using that environment's DATABASE_URL — including the
# Neon branch a preview deployment gets. A separate CI job would duplicate
# that, and could not guarantee it ran first anyway, since Vercel builds start
# on push in parallel with this workflow.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push to the same branch supersedes this run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      # v5 runs on Node 24; v4 targeted Node 20, which the runners now force
      # onto 24 anyway and warn about. See the deprecation notice in the
      # GitHub changelog, 19 September 2025.
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The suite runs in real Chromium rather than jsdom — the canvas and
      # hit-testing assertions are meaningless without a browser — so the
      # browser has to be present.
      - name: Install Chromium for vitest
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck and file-size ceiling
        run: pnpm lint

      - name: Lint
        run: pnpm exec ultracite check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The document is generated, so a route added without regenerating it
      # would leave the committed copy stale. Regenerate and fail on a diff.
      - name: OpenAPI is current
        run: |
          pnpm api:docs
          if ! git diff --quiet -- openapi.json openapi.yaml; then
            echo "::error::openapi.json / openapi.yaml are out of date. Run 'pnpm api:docs' and commit."
            git diff --stat -- openapi.json openapi.yaml
            exit 1
          fi
