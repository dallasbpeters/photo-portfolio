<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- %SITE_*% placeholders are substituted per site by the siteBranding plugin in vite.config.ts -->
  <meta name="theme-color" content="%SITE_THEME_COLOR%" />
  <link rel="icon" href="/sites/%SITE_KEY%/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/sites/%SITE_KEY%/icon512_rounded.png" />
  <!-- Served from the database so name/theme changes need no rebuild. -->
  <link rel="manifest" href="/api/manifest" type="application/manifest+json" />
  <title>%SITE_NAME%</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
