<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <!-- %SITE_*% placeholders are substituted per site by the siteBranding plugin in vite.config.ts -->
    <meta content="%SITE_THEME_COLOR%" name="theme-color">
    <link href="/sites/%SITE_KEY%/favicon.svg" rel="icon" type="image/svg+xml">
    <link href="/sites/%SITE_KEY%/icon512_rounded.png" rel="apple-touch-icon">
    <!-- iOS ignores the manifest for these; it needs its own hints. -->
    <meta content="yes" name="mobile-web-app-capable">
    <meta
      content="black-translucent"
      name="apple-mobile-web-app-status-bar-style"
    >
    <meta content="%SITE_SHORT_NAME%" name="apple-mobile-web-app-title">
    <meta content="%SITE_DESCRIPTION%" name="description">
    <!-- Served from the database so name/theme changes need no rebuild. -->
    <link href="/api/manifest" rel="manifest" type="application/manifest+json">
    <title>%SITE_NAME%</title>
    <!--
      The theme, before the first paint.

      React cannot do this: by the time it mounts, the page has already been
      drawn once in the wrong colours, which is the white flash every dark-mode
      app is known for. Deliberately duplicates the few lines in src/theme/theme.ts
      rather than importing them — a module import is a round trip, and a round
      trip here is exactly the delay this exists to avoid. Keep the two in step.
    -->
    <script>
    "use strict";
    (() => {
      try {
        const saved = localStorage.getItem("theme");
        const choice = saved === "dark" || saved === "light" ? saved : "system";
        const dark =
          choice === "dark" ||
          (choice === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {
        // A browser with storage denied still gets a page, in whatever the
        // stylesheet's own default is. Not worth breaking the load over.
      }
    })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
